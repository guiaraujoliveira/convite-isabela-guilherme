<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Isabela & Guilherme — Convite</title>

<meta property="og:type" content="website">
<meta property="og:title" content="Isabela &amp; Guilherme — 28/11/2026">
<meta property="og:description" content="Nosso convite de casamento 💍">
<meta property="og:image" content="https://isabelaeguilherme-28-11-2026.tiiny.site/frente.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1085">
<meta property="og:image:height" content="1536">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Isabela &amp; Guilherme — 28/11/2026">
<meta name="twitter:description" content="Nosso convite de casamento 💍">
<meta name="twitter:image" content="https://isabelaeguilherme-28-11-2026.tiiny.site/frente.jpg">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #f7f5f0;
  font-family: Arial, sans-serif;
}

body {
  overflow-x: hidden;
}

.invitation {
  width: min(100%, 760px);
  margin: 0 auto;
  padding: 24px 14px 150px;
}

/* ========================================
   CARTÃO 3D
   ======================================== */

.flip-container {
  width: 100%;
  perspective: 1800px;
}

.flip-card {
  position: relative;
  width: 100%;
  transform-style: preserve-3d;
  transition: transform 900ms cubic-bezier(.22, .61, .36, 1);
}

.flip-card.flipped {
  transform: rotateY(180deg);
}

/* ========================================
   FACES
   ======================================== */

.card-face {
  width: 100%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.card-face img {
  display: block;
  width: 100%;
  height: auto;
}

.card-back {
  position: absolute;
  inset: 0;
  transform: rotateY(180deg);
}

/*
   Importante:
   As faces não possuem mais botões.
   Os botões ficam fora do cartão 3D.
*/

/* ========================================
   BOTÕES
   ======================================== */

.actions {
  position: relative;
  z-index: 20;

  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;

  gap: 12px;
  margin: 20px auto 0;
  padding: 0 8px;
}

button,
.site-link {
  appearance: none;

  border: 1px solid #b08a35;
  background: rgba(255, 255, 255, .98);
  color: #444;

  padding: 11px 17px;
  border-radius: 24px;

  font-size: 13px;
  font-weight: 700;

  text-decoration: none;
  cursor: pointer;

  box-shadow: 0 2px 8px rgba(0, 0, 0, .12);

  transition:
    transform 150ms ease,
    box-shadow 150ms ease;
}

button:hover,
.site-link:hover {
  box-shadow: 0 4px 12px rgba(0, 0, 0, .16);
}

button:active,
.site-link:active {
  transform: scale(.98);
}

/* ========================================
   MANUAL
   ======================================== */

.manual {
  display: none;
  width: 100%;
}

.manual.active {
  display: block;
}

.manual img {
  display: block;
  width: 100%;
  height: auto;
}

/* ========================================
   MOBILE
   ======================================== */

@media (max-width: 600px) {

  .invitation {
    width: 100%;
    padding: 18px 12px 150px;
  }

  .flip-container {
    perspective: 1200px;
  }

  .flip-card {
    transition-duration: 800ms;
  }

  .actions {
    margin-top: 18px;
    gap: 9px;
  }

  button,
  .site-link {
    font-size: 12px;
    padding: 10px 13px;
  }
}

/* ========================================
   ACESSIBILIDADE
   ======================================== */

@media (prefers-reduced-motion: reduce) {

  .flip-card {
    transition: none;
  }

}
</style>
</head>

<body>

<main class="invitation" aria-label="Convite interativo de casamento">

  <!-- ====================================
       CONVITE FRENTE/VERSO
       ==================================== -->

  <div id="flipContainer" class="flip-container">

    <div id="flipCard" class="flip-card">

      <!-- FRENTE -->
      <section class="card-face card-front">

        <img
          src="frente.jpg"
          alt="Frente do convite de casamento de Isabela e Guilherme"
        >

      </section>

      <!-- VERSO -->
      <section class="card-face card-back">

        <img
          src="verso.jpg"
          alt="Verso do convite de casamento de Isabela e Guilherme"
        >

      </section>

    </div>

  </div>


  <!-- ====================================
       BOTÕES DO CONVITE
       ==================================== -->

  <div id="invitationActions" class="actions">

    <button
      id="flipButton"
      type="button"
      onclick="toggleFlip()"
    >
      VER O VERSO
    </button>

    <button
      type="button"
      onclick="showManual()"
    >
      MANUAL DOS CONVIDADOS
    </button>

    <a
      class="site-link"
      href="https://noivos.casar.com/isabelaeguilherme-28-11-2026"
      target="_blank"
      rel="noopener"
    >
      SITE DO CASAMENTO
    </a>

  </div>


  <!-- ====================================
       MANUAL
       ==================================== -->

  <section
    id="manual"
    class="manual"
    aria-label="Manual dos convidados"
  >

    <img
      src="manual.jpg"
      alt="Manual dos convidados"
    >

    <div class="actions">

      <button
        type="button"
        onclick="hideManual()"
      >
        VOLTAR AO CONVITE
      </button>

      <a
        class="site-link"
        href="https://noivos.casar.com/isabelaeguilherme-28-11-2026"
        target="_blank"
        rel="noopener"
      >
        SITE DO CASAMENTO
      </a>

    </div>

  </section>

</main>


<script>

/* ========================================
   FRENTE <-> VERSO
   ======================================== */

function toggleFlip() {

  const card = document.getElementById('flipCard');
  const button = document.getElementById('flipButton');

  const isFlipped = card.classList.toggle('flipped');

  if (isFlipped) {

    button.textContent = 'VOLTAR À FRENTE';

  } else {

    button.textContent = 'VER O VERSO';

  }

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}


/* ========================================
   ABRIR MANUAL
   ======================================== */

function showManual() {

  document.getElementById('flipContainer').style.display = 'none';

  document.getElementById('invitationActions').style.display = 'none';

  document
    .getElementById('manual')
    .classList.add('active');

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}


/* ========================================
   VOLTAR DO MANUAL
   ======================================== */

function hideManual() {

  document
    .getElementById('manual')
    .classList.remove('active');

  document.getElementById('flipContainer').style.display = 'block';

  document.getElementById('invitationActions').style.display = 'flex';

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}

</script>

</body>
</html>
