<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isabela & Guilherme — Convite</title>

<meta property="og:type" content="website">
<meta property="og:title" content="Isabela &amp; Guilherme — 28/11/2026">
<meta property="og:description" content="Nosso convite de casamento 💍">
<meta property="og:image" content="https://isabelaeguilherme-28-11-2026.tiiny.site/frente.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1085">
<meta property="og:image:height" content="1536">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Isabela &amp; Guilherme — 28/11/2026">
<meta name="twitter:description" content="Nosso convite de casamento 💍">
<meta name="twitter:image" content="https://isabelaeguilherme-28-11-2026.tiiny.site/frente.jpg">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #f7f5f0;
  font-family: Arial, sans-serif;
}

body {
  overflow-x: hidden;
}

.invitation {
  width: min(100%, 760px);
  margin: 0 auto;
  padding: 24px 14px 150px;
}

.side {
  display: none;
  width: 100%;
}

.side.active {
  display: block;
}

.art {
  display: block;
  width: 100%;
  height: auto;
  margin: 0 auto;
}

.actions {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 20px auto 0;
  padding: 0 8px;
}

button, .site-link {
  appearance: none;
  border: 1px solid #b08a35;
  background: rgba(255,255,255,.98);
  color: #444;
  padding: 11px 17px;
  border-radius: 24px;
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
}

button:active, .site-link:active {
  transform: scale(.98);
}

@media (max-width: 600px) {
  .invitation {
    width: 100%;
    padding: 18px 12px 150px;
  }

  .actions {
    margin-top: 18px;
    gap: 9px;
  }

  button, .site-link {
    font-size: 12px;
    padding: 10px 13px;
  }
}
</style>
</head>

<body>
<main class="invitation" aria-label="Convite interativo de casamento">

  <section id="front" class="side active" aria-label="Frente do convite">
    <img class="art" src="frente.jpg" alt="Frente do convite de casamento de Isabela e Guilherme">
    <div class="actions">
      <button type="button" onclick="showSide('back')">VER O VERSO</button>
      <a class="site-link" href="https://noivos.casar.com/isabelaeguilherme-28-11-2026" target="_blank" rel="noopener">SITE DO CASAMENTO</a>
    </div>
  </section>

  <section id="back" class="side" aria-label="Verso do convite">
    <img class="art" src="verso.jpg" alt="Verso do convite de casamento de Isabela e Guilherme">
    <div class="actions">
      <button type="button" onclick="showSide('front')">VOLTAR À FRENTE</button>
      <a class="site-link" href="https://noivos.casar.com/isabelaeguilherme-28-11-2026" target="_blank" rel="noopener">SITE DO CASAMENTO</a>
    </div>
  </section>

</main>

<script>
function showSide(side) {
  document.querySelectorAll('.side').forEach(function(el) {
    el.classList.remove('active');
  });
  document.getElementById(side).classList.add('active');
  window.scrollTo({top: 0, behavior: 'smooth'});
}
</script>
</body>
</html>
